<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a1f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Lucky Tarot: Love &amp; Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/app.css?v=18">
  <script>
    // Telegram Mini App відкриває сторінку з #tgWebAppData… — тільки тоді підвантажуємо їхній SDK
    if (/tgWebApp/.test(location.hash + location.search)) {
      document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="boot" class="boot">
      <div class="boot-orb"><div class="orb-core"></div><div class="orb-ring r1"></div><div class="orb-ring r2"></div></div>
      <div class="boot-name serif">Lucky Tarot</div>
      <div class="boot-text">Tarot &amp; Astrology</div>
    </div>

    <main id="tabs" class="tabs hidden">
      <section class="tab" id="tab-today"></section>
      <section class="tab" id="tab-spreads"></section>
      <section class="tab" id="tab-oracle"></section>
      <section class="tab" id="tab-cards"></section>
      <section class="tab" id="tab-learn"></section>
    </main>
    <nav id="tabbar" class="tabbar hidden"></nav>

    <div id="layers"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
